// ATOMIC TV Capture | JB ATOMIC INDUSTRIES | https://jbatomic.com/
plugins { id 'com.android.application' }

android {
    namespace 'com.jbatomic.tvcapture'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.jbatomic.tvcapture'
        minSdk 30
        targetSdk 34
        versionCode 30101
        versionName '3.1.1'
    }

    signingConfigs {
        release {
            def keyPath = project.findProperty('TV_CAPTURE_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword project.findProperty('TV_CAPTURE_STORE_PASSWORD') ?: ''
                keyAlias project.findProperty('TV_CAPTURE_KEY_ALIAS') ?: 'tv-capture'
                keyPassword project.findProperty('TV_CAPTURE_KEY_PASSWORD') ?: ''
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' 
            if (project.findProperty('TV_CAPTURE_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
