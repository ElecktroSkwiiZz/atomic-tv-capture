plugins { id 'com.android.application' }

android {
    namespace 'com.jbatomic.tvconsole'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jbatomic.tvconsole'
        minSdk 30
        targetSdk 34
        versionCode 10000
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'com.tananaev:adblib:1.3' }
