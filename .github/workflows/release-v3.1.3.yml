name: ATOMIC TV Capture - Publication officielle v3.1.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3.1.3.yml'
jobs:
  release-v313:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer les composants SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verifier la version et l'absence de release existante
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Eq "versionCode[[:space:]]+30103" app/build.gradle
          grep -Fq "versionName '3.1.3'" app/build.gradle
          if gh release view v3.1.3 >/dev/null 2>&1; then
            echo 'La release v3.1.3 existe deja : aucune nouvelle publication.'
            exit 1
          fi
      - name: Restaurer le certificat de signature officiel
        env:
          TV_KEY_B64: ${{ secrets.TV_CAPTURE_KEYSTORE_BASE64 }}
          TV_PASS: ${{ secrets.TV_CAPTURE_STORE_PASSWORD }}
          TV_KEY_PASS: ${{ secrets.TV_CAPTURE_KEY_PASSWORD }}
          TV_ALIAS: ${{ secrets.TV_CAPTURE_KEY_ALIAS }}
        run: |
          [ -n "$TV_KEY_B64" ] && [ -n "$TV_PASS" ] && [ -n "$TV_KEY_PASS" ] && [ -n "$TV_ALIAS" ] || { echo 'Secrets de signature manquants'; exit 1; }
          printf '%s' "$TV_KEY_B64" | base64 --decode > "$RUNNER_TEMP/atomic-tv-capture-release.jks"
      - name: Compiler une APK officielle signee
        env:
          TV_PASS: ${{ secrets.TV_CAPTURE_STORE_PASSWORD }}
          TV_KEY_PASS: ${{ secrets.TV_CAPTURE_KEY_PASSWORD }}
          TV_ALIAS: ${{ secrets.TV_CAPTURE_KEY_ALIAS }}
        run: |
          gradle --no-daemon assembleRelease \
            -PTV_CAPTURE_KEYSTORE="$RUNNER_TEMP/atomic-tv-capture-release.jks" \
            -PTV_CAPTURE_STORE_PASSWORD="$TV_PASS" \
            -PTV_CAPTURE_KEY_PASSWORD="$TV_KEY_PASS" \
            -PTV_CAPTURE_KEY_ALIAS="$TV_ALIAS"
          cp app/build/outputs/apk/release/app-release.apk ATOMIC-TV-Capture-AndroidTV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ATOMIC-TV-Capture-AndroidTV.apk > "$RUNNER_TEMP/signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]' | head -1)
          expected=$(sed -n 's/^Certificat SHA-256 : //p' SIGNATURE_PUBLIQUE.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ -n "$actual" ] && [ "$actual" = "$expected" ] || { echo 'Signature invalide'; exit 1; }
          sha256sum ATOMIC-TV-Capture-AndroidTV.apk > ATOMIC-TV-Capture-AndroidTV.apk.sha256
      - name: Publier la Release GitHub v3.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.3 \
            ATOMIC-TV-Capture-AndroidTV.apk ATOMIC-TV-Capture-AndroidTV.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "ATOMIC TV Capture v3.1.3" \
            --notes "Interface bilingue français/anglais : bouton de langue FR/EN, ecrans TV, notifications, raccourcis et portail PC traduits. Mise a jour signee avec le certificat officiel JB Atomic Industries."
