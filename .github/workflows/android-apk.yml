name: ATOMIC TV Capture - Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Compiler ATOMIC TV Capture
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to publish a signed APK to a GitHub Release
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Préparer Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler une APK de test sur main
        if: github.ref == 'refs/heads/main'
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Vérifier la compilation Release protégée (R8)
        if: github.ref == 'refs/heads/main'
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Exporter l'APK de test
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ATOMIC-TV-Capture-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Vérifier que le tag correspond à la version Android
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} différent de la version Android v${version}" >&2
            exit 1
          fi
      - name: Vérifier si la version Android doit être publiée
        id: release_plan
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle | head -1)
          [ -n "$version" ] || { echo "Version Android manquante" >&2; exit 1; }
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La Release v${version} existe déjà, aucune nouvelle publication."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "La Release v${version} sera compilée et signée."
          fi
      - name: Restaurer la clé de signature (depuis GitHub Secrets)
        if: startsWith(github.ref, 'refs/tags/v') || steps.release_plan.outputs.publish == 'true'
        shell: bash
        env:
          TV_KEY_B64: ${{ secrets.TV_CAPTURE_KEYSTORE_BASE64 }}
          TV_PASS: ${{ secrets.TV_CAPTURE_STORE_PASSWORD }}
          TV_KEY_PASS: ${{ secrets.TV_CAPTURE_KEY_PASSWORD }}
          TV_ALIAS: ${{ secrets.TV_CAPTURE_KEY_ALIAS }}
        run: |
          [ -n "$TV_KEY_B64" ] && [ -n "$TV_PASS" ] && [ -n "$TV_KEY_PASS" ] && [ -n "$TV_ALIAS" ] || { echo 'Secrets de signature manquants'; exit 1; }
          printf '%s' "$TV_KEY_B64" | base64 --decode > "$RUNNER_TEMP/atomic-tv-capture-release.jks"
      - name: Compiler la Release officielle signée
        if: startsWith(github.ref, 'refs/tags/v') || steps.release_plan.outputs.publish == 'true'
        shell: bash
        env:
          TV_PASS: ${{ secrets.TV_CAPTURE_STORE_PASSWORD }}
          TV_KEY_PASS: ${{ secrets.TV_CAPTURE_KEY_PASSWORD }}
          TV_ALIAS: ${{ secrets.TV_CAPTURE_KEY_ALIAS }}
        run: |
          gradle --no-daemon assembleRelease \
            -PTV_CAPTURE_KEYSTORE="$RUNNER_TEMP/atomic-tv-capture-release.jks" \
            -PTV_CAPTURE_STORE_PASSWORD="$TV_PASS" \
            -PTV_CAPTURE_KEY_PASSWORD="$TV_KEY_PASS" \
            -PTV_CAPTURE_KEY_ALIAS="$TV_ALIAS"
          cp app/build/outputs/apk/release/app-release.apk ATOMIC-TV-Capture-AndroidTV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ATOMIC-TV-Capture-AndroidTV.apk > "$RUNNER_TEMP/signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]' | head -1)
          expected=$(sed -n 's/^Certificat SHA-256 : //p' SIGNATURE_PUBLIQUE.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo 'Signature Release non conforme au certificat officiel' >&2
            exit 1
          fi
          sha256sum ATOMIC-TV-Capture-AndroidTV.apk > ATOMIC-TV-Capture-AndroidTV.apk.sha256
      - name: Publier l'APK signée dans une GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.release_plan.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          publish_flags=(--verify-tag)
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="${{ steps.release_plan.outputs.tag }}"
            publish_flags=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" \
            ATOMIC-TV-Capture-AndroidTV.apk ATOMIC-TV-Capture-AndroidTV.apk.sha256 \
            --title "ATOMIC TV Capture $tag" \
            --generate-notes "${publish_flags[@]}"
      - name: Conserver une copie de l'APK signée
        if: startsWith(github.ref, 'refs/tags/v') || steps.release_plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ATOMIC-TV-Capture-RELEASE-SIGNED
          path: ATOMIC-TV-Capture-AndroidTV.apk
          if-no-files-found: error
